services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-data:
